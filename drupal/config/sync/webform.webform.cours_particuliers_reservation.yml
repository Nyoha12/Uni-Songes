id: cours_particuliers_reservation
title: 'Réservation cours particuliers'
description: 'Formulaire de réservation des cours particuliers.'
categories: {  }
elements: |-
  reservation:
    '#type': webform_booking
    '#title': 'Choisir un créneau'
    '#description': 'Disponibilités consultables par tous ; réservation effective pour les utilisateurs connectés.'
    '#required': true
    '#access_view_roles':
      - anonymous
      - authenticated
    '#access_create_roles':
      - authenticated
    '#access_update_roles':
      - authenticated
    '#access_view_permissions': {  }
    '#access_create_permissions': {  }
    '#access_update_permissions': {  }
    '#days_visible': '30'
    '#slot_duration': 60
    '#seats_slot': '1'
    '#max_seats_per_booking': 1
    '#time_interval': '9:00|16:30'
    '#no_slots': 'Aucun créneau disponible.'
    '#date_label': Date
    '#slot_label': Créneau
    '#seats_label': Places
  mode_cours:
    '#type': radios
    '#title': 'Mode du cours'
    '#required': true
    '#options':
      visio: Visio
      studio: 'Au studio à Aubervilliers'
      domicile: 'À domicile'
    '#description': 'Studio : 1 rue du chemin vert, 93300 Aubervilliers.'
  plateforme_visio:
    '#type': select
    '#title': 'Plateforme de visio'
    '#required': true
    '#empty_option': '- Sélectionner -'
    '#options':
      zoom: Zoom
      google_meet: 'Google Meet'
      skype: Skype
      whatsapp: WhatsApp
      autre: Autre
    '#states':
      visible:
        ':input[name="mode_cours"]':
          value: visio
      required:
        ':input[name="mode_cours"]':
          value: visio
  adresse_domicile:
    '#type': textarea
    '#title': 'Adresse complète'
    '#required': true
    '#states':
      visible:
        ':input[name="mode_cours"]':
          value: domicile
      required:
        ':input[name="mode_cours"]':
          value: domicile
    '#description': 'Renseigne la rue, la ville et les informations utiles d’accès.'
  telephone:
    '#type': tel
    '#title': Téléphone
    '#required': true
    '#placeholder': '06 12 34 56 78'
    '#description': 'Format attendu : 06 12 34 56 78'
    '#pattern': '^(?:0|\+33\s?)[1-9](?:[\s.-]?\d{2}){4}$'
    '#pattern_error': 'Merci de saisir un numéro français valide, par ex. 06 12 34 56 78.'
    '#attributes':
      inputmode: tel
      autocomplete: tel
  instrument:
    '#type': radios
    '#title': Instrument
    '#required': true
    '#options':
      guimbarde: Guimbarde
      didgeridoo: Didgeridoo
  didgeridoo_pret:
    '#type': radios
    '#title': 'Le professeur doit-il fournir un didgeridoo ?'
    '#required': true
    '#options':
      oui: Oui
      non: Non
    '#states':
      visible:
        ':input[name="instrument"]':
          value: didgeridoo
      required:
        ':input[name="instrument"]':
          value: didgeridoo
  niveau_cours:
    '#type': select
    '#title': 'Niveau du cours'
    '#required': true
    '#empty_option': '- Sélectionner -'
    '#options':
      debutant: Débutant
      intermediaire: Intermédiaire
      avance: Avancé
  notes_supplementaires:
    '#type': textarea
    '#title': 'Notes supplémentaires'
    '#required': false
  code_postal_domicile:
    '#type': textfield
    '#title': 'Code postal'
    '#required': true
    '#size': 10
    '#maxlength': 5
    '#placeholder': '93300'
    '#description': 'Format attendu : 5 chiffres.'
    '#pattern': '^\d{5}$'
    '#pattern_error': 'Merci de saisir un code postal français à 5 chiffres.'
    '#states':
      visible:
        ':input[name="mode_cours"]':
          value: domicile
      required:
        ':input[name="mode_cours"]':
          value: domicile
