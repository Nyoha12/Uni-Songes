id: contact
title: Contact
description: 'Formulaire de contact privé, examiné uniquement dans l’administration Drupal.'
categories: {  }
elements: |-
  name:
    '#type': textfield
    '#title': Nom
    '#description': 'Indiquez le nom à utiliser pour vous répondre.'
    '#required': true
    '#required_error': 'Veuillez indiquer votre nom.'
    '#maxlength': 120
    '#attributes':
      autocomplete: name
  email:
    '#type': email
    '#title': 'Adresse e-mail'
    '#description': 'Indiquez une adresse valide à laquelle l’association pourra vous répondre.'
    '#required': true
    '#required_error': 'Veuillez indiquer votre adresse e-mail.'
    '#maxlength': 254
    '#attributes':
      autocomplete: email
      inputmode: email
  subject:
    '#type': select
    '#title': Objet
    '#description': 'Choisissez la catégorie qui correspond le mieux à votre demande.'
    '#required': true
    '#required_error': 'Veuillez choisir un objet.'
    '#empty_option': '- Sélectionner -'
    '#options':
      cours_stages: 'Cours et stages'
      concerts_evenements: 'Concerts et événements'
      projets_collectifs: 'Projets collectifs'
      association_partenariats: 'Association et partenariats'
      prestations_artistiques: 'Prestations artistiques'
      autre: Autre
  message:
    '#type': textarea
    '#title': Message
    '#description': 'Décrivez votre demande en 20 à 5 000 caractères.'
    '#required': true
    '#required_error': 'Veuillez saisir votre message.'
    '#rows': 10
    '#minlength': 20
    '#maxlength': 5000
    '#pattern': '[\s\S]{20,5000}'
    '#pattern_error': 'Le message doit contenir entre 20 et 5 000 caractères.'
  consent:
    '#type': checkbox
    '#title': 'J’accepte que les informations fournies soient utilisées uniquement pour traiter ma demande de contact et y répondre.'
    '#required': true
    '#required_error': 'Votre consentement est nécessaire pour envoyer cette demande.'
  actions:
    '#type': webform_actions
    '#title': Actions
    '#submit__label': 'Envoyer la demande'
