unisonges_structure.google_calendar:
  type: config_object
  label: 'Unisonges Google Calendar state-foundation hold'
  mapping:
    enabled:
      type: boolean
      label: 'Enable synchronization'
    dry_run:
      type: boolean
      label: 'Dry-run mode'
    calendar_id:
      type: string
      label: 'Preserved inactive Google Calendar ID'
    timezone:
      type: string
      label: 'Event timezone'
    batch_size:
      type: integer
      label: 'Reserved future worker batch size'
    token_provider:
      type: string
      label: 'Disabled token provider mode'
    access_token_env_var:
      type: string
      label: 'Preserved inactive token locator'
